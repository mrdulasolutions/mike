AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Mike regulated workspace (HIPAA-aware commercial MVP, ITAR-conscious).
  CostProfile=mvp (default): single small EC2, no NAT, Postgres on-box, S3+Cognito+KMS.
  CostProfile=standard: NAT + private subnets + RDS (higher cost / production-shaped).

Metadata:
  Project: mike-regulated
  Compliance: HIPAA-ITAR-commercial-mvp

Parameters:
  CostProfile:
    Type: String
    Default: mvp
    AllowedValues: [mvp, standard]
    Description: >
      mvp ~ lowest fixed cost (no NAT Gateway, no RDS; Postgres on EC2).
      standard = private subnets + NAT + managed RDS (much more expensive).
  EnvironmentName:
    Type: String
    Default: staging
    AllowedValues: [prod, staging]
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large, t3.xlarge, m6i.large]
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium]
    Description: Only used when CostProfile=standard
  DbName:
    Type: String
    Default: mike
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9]*"
  DbUsername:
    Type: String
    Default: mikeadmin
  LatestAmiId:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  TailscaleAuthKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional Tailscale auth key for first boot

Conditions:
  IsMvp: !Equals [!Ref CostProfile, mvp]
  IsStandard: !Equals [!Ref CostProfile, standard]
  HasTailscaleKey: !Not [!Equals [!Ref TailscaleAuthKey, ""]]

Resources:
  # ---------------------------------------------------------------------------
  # KMS
  # ---------------------------------------------------------------------------
  RegulatedKey:
    Type: AWS::KMS::Key
    Properties:
      Description: mike-regulated CMK for S3/Secrets/(RDS)
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Root
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"
          - Sid: ViaServices
            Effect: Allow
            Principal:
              AWS: "*"
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:CreateGrant
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
              StringLike:
                kms:ViaService:
                  - !Sub "s3.${AWS::Region}.amazonaws.com"
                  - !Sub "rds.${AWS::Region}.amazonaws.com"
                  - !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
                  - !Sub "logs.${AWS::Region}.amazonaws.com"
                  - !Sub "ec2.${AWS::Region}.amazonaws.com"
          - Sid: CloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*

  RegulatedKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/mike-regulated
      TargetKeyId: !Ref RegulatedKey

  # ---------------------------------------------------------------------------
  # Network - always a dedicated VPC; MVP uses 1 public subnet (no NAT)
  # ---------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.50.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: mike-regulated-vpc
        - Key: Project
          Value: mike-regulated
        - Key: Compliance
          Value: HIPAA-ITAR-commercial-mvp
        - Key: CostProfile
          Value: !Ref CostProfile

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: mike-regulated-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: mike-regulated-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Condition: IsStandard
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: mike-regulated-public-b

  PrivateAppSubnetA:
    Type: AWS::EC2::Subnet
    Condition: IsStandard
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: mike-regulated-app-a

  PrivateDbSubnetA:
    Type: AWS::EC2::Subnet
    Condition: IsStandard
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.20.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: mike-regulated-db-a

  PrivateDbSubnetB:
    Type: AWS::EC2::Subnet
    Condition: IsStandard
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.21.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: mike-regulated-db-b

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: mike-regulated-public-rt

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: IsStandard
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # NAT only for standard (biggest fixed-cost saver when skipped)
  NatEip:
    Type: AWS::EC2::EIP
    Condition: IsStandard
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: mike-regulated-nat-eip

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: IsStandard
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: mike-regulated-nat

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: IsStandard
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: mike-regulated-private-rt

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Condition: IsStandard
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateAppRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: IsStandard
    Properties:
      SubnetId: !Ref PrivateAppSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateDbARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: IsStandard
    Properties:
      SubnetId: !Ref PrivateDbSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateDbBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: IsStandard
    Properties:
      SubnetId: !Ref PrivateDbSubnetB
      RouteTableId: !Ref PrivateRouteTable

  FlowLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: flow-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: "*"

  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /mike-regulated/vpc-flow
      RetentionInDays: 30
      # No KMS on log groups in MVP to avoid key-policy edge cases; enable later if required

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceType: VPC
      ResourceId: !Ref Vpc
      TrafficType: REJECT
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogsRole.Arn
      Tags:
        - Key: Name
          Value: mike-regulated-flow

  # ---------------------------------------------------------------------------
  # Security groups
  # ---------------------------------------------------------------------------
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Mike app - no public app ingress; Tailscale mesh only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound Mantle, updates, Tailscale
      Tags:
        - Key: Name
          Value: mike-regulated-app-sg

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsStandard
    Properties:
      GroupDescription: RDS only from app SG
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: mike-regulated-db-sg

  # ---------------------------------------------------------------------------
  # S3
  # ---------------------------------------------------------------------------
  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt RegulatedKey.Arn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: mike-regulated
        - Key: Compliance
          Value: HIPAA-ITAR-commercial-mvp

  DocsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DocsBucket.Arn
              - !Sub "${DocsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # ---------------------------------------------------------------------------
  # Secrets + optional RDS
  # ---------------------------------------------------------------------------
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub mike-regulated/${EnvironmentName}/db
      Description: Mike DB credentials (RDS when standard; local Postgres when mvp)
      KmsKeyId: !Ref RegulatedKey
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DbUsername}","dbname":"${DbName}","engine":"postgres"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\\'
      Tags:
        - Key: Project
          Value: mike-regulated

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: IsStandard
    Properties:
      DBSubnetGroupDescription: mike-regulated db subnets
      SubnetIds:
        - !Ref PrivateDbSubnetA
        - !Ref PrivateDbSubnetB

  DbInstance:
    Type: AWS::RDS::DBInstance
    Condition: IsStandard
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub mike-regulated-${EnvironmentName}
      Engine: postgres
      EngineVersion: "16"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: 20
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: !Ref RegulatedKey
      DBName: !Ref DbName
      MasterUsername: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: true
      EnableCloudwatchLogsExports:
        - postgresql
      Tags:
        - Key: Project
          Value: mike-regulated

  # ---------------------------------------------------------------------------
  # Cognito
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub mike-regulated-${EnvironmentName}
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: "ON"
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 3
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolAddOns:
        AdvancedSecurityMode: "OFF"
      Schema:
        - Name: email
          Required: true
          Mutable: true
      UserPoolTags:
        Project: mike-regulated
        CostProfile: !Ref CostProfile

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: mike-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      SupportedIdentityProviders:
        - COGNITO

  # ---------------------------------------------------------------------------
  # IAM + EC2
  # ---------------------------------------------------------------------------
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub mike-regulated-app-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: mike-regulated-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3Docs
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DocsBucket.Arn
                  - !Sub "${DocsBucket.Arn}/*"
              - Sid: Secrets
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:PutSecretValue
                Resource:
                  - !Ref DbSecret
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:mike-regulated/*
              - Sid: Kms
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !GetAtt RegulatedKey.Arn
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/mike-regulated/*

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AppRole

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /mike-regulated/app
      RetentionInDays: 30

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref AppInstanceProfile
      # MVP: public subnet for outbound without NAT (~$32/mo saved).
      # Standard: private app subnet via NAT.
      SubnetId: !If [IsMvp, !Ref PublicSubnetA, !Ref PrivateAppSubnetA]
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !If [IsMvp, 30, 40]
            VolumeType: gp3
            Encrypted: true
            KmsKeyId: !Ref RegulatedKey
            DeleteOnTermination: true
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
        InstanceMetadataTags: enabled
      UserData:
        # Use single-quoted CFN interpolations so values stay on one line.
        # Bash must use $name (not ${name}) to avoid Fn::Sub collisions.
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf update -y
          dnf install -y docker git jq aws-cli
          systemctl enable --now docker
          usermod -aG docker ec2-user || true

          region='${AWS::Region}'
          cost_profile='${CostProfile}'
          db_secret_arn='${DbSecret}'
          docs_bucket='${DocsBucket}'
          user_pool_id='${UserPool}'
          client_id='${UserPoolClient}'
          ts_key='${TailscaleAuthKey}'

          mkdir -p /opt/mike-regulated
          cat > /opt/mike-regulated/stack-outputs.env <<EOF
          AWS_REGION=$region
          S3_BUCKET_NAME=$docs_bucket
          COGNITO_USER_POOL_ID=$user_pool_id
          COGNITO_CLIENT_ID=$client_id
          DB_SECRET_ARN=$db_secret_arn
          REGULATED_MODE=true
          COST_PROFILE=$cost_profile
          PROJECT=mike-regulated
          EOF

          if [ "$cost_profile" = "mvp" ]; then
            for i in $(seq 1 30); do
              secret_json=$(aws secretsmanager get-secret-value --region "$region" --secret-id "$db_secret_arn" --query SecretString --output text 2>/dev/null) && break
              sleep 2
            done
            db_user=$(echo "$secret_json" | jq -r .username)
            db_pass=$(echo "$secret_json" | jq -r .password)
            db_name=$(echo "$secret_json" | jq -r .dbname)
            docker volume create mike-pg-data || true
            docker rm -f mike-postgres 2>/dev/null || true
            docker run -d --name mike-postgres --restart unless-stopped \
              -e POSTGRES_USER="$db_user" \
              -e POSTGRES_PASSWORD="$db_pass" \
              -e POSTGRES_DB="$db_name" \
              -v mike-pg-data:/var/lib/postgresql/data \
              -p 127.0.0.1:5432:5432 \
              postgres:16-alpine
            merged=$(python3 -c "import json,sys; d=json.loads(sys.argv[1]); d['host']='127.0.0.1'; d['port']=5432; print(json.dumps(d))" "$secret_json")
            aws secretsmanager put-secret-value --region "$region" --secret-id "$db_secret_arn" --secret-string "$merged" || true
            echo "DATABASE_URL=postgres://$db_user@127.0.0.1:5432/$db_name" >> /opt/mike-regulated/stack-outputs.env
          fi

          if [ -n "$ts_key" ]; then
            curl -fsSL https://tailscale.com/install.sh | sh
            tailscale up --auth-key="$ts_key" --hostname=mike-regulated --ssh=false || true
          fi

          echo "mike-regulated bootstrap complete profile=$cost_profile $(date -u)" >> /var/log/mike-regulated-bootstrap.log


      Tags:
        - Key: Name
          Value: mike-regulated
        - Key: Project
          Value: mike-regulated
        - Key: Compliance
          Value: HIPAA-ITAR-commercial-mvp
        - Key: CostProfile
          Value: !Ref CostProfile
        - Key: Environment
          Value: !Ref EnvironmentName

  MantleSecretPlaceholder:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub mike-regulated/${EnvironmentName}/mantle
      Description: Bedrock Mantle API key for Mike (set value after deploy)
      KmsKeyId: !Ref RegulatedKey
      SecretString: !Sub |
        {
          "OPENAI_API_KEY": "REPLACE_ME",
          "OPENAI_BASE_URL": "https://bedrock-mantle.us-east-2.api.aws/v1",
          "OPENAI_API_MODE": "auto",
          "OPENAI_COMPAT_ANY_MODEL": "true"
        }
      Tags:
        - Key: Project
          Value: mike-regulated

Outputs:
  CostProfile:
    Value: !Ref CostProfile
  VpcId:
    Value: !Ref Vpc
  DocsBucketName:
    Value: !Ref DocsBucket
  DbEndpoint:
    Description: RDS address when standard; empty-ish when mvp (use 127.0.0.1 on host)
    Value: !If
      - IsStandard
      - !GetAtt DbInstance.Endpoint.Address
      - 127.0.0.1
  DbSecretArn:
    Value: !Ref DbSecret
  MantleSecretArn:
    Value: !Ref MantleSecretPlaceholder
  CognitoUserPoolId:
    Value: !Ref UserPool
  CognitoClientId:
    Value: !Ref UserPoolClient
  AppInstanceId:
    Value: !Ref AppInstance
  AppPublicIp:
    Value: !GetAtt AppInstance.PublicIp
    Description: Bootstrap/SSM only - app access via Tailscale
  EstimatedMonthlyHint:
    Value: !If
      - IsMvp
      - "~$20-45/mo (t3.small/medium + EBS + S3/KMS; no NAT, no RDS)"
      - "~$120-200+/mo (NAT + RDS + larger host)"
