AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Mike regulated workspace (HIPAA-aware commercial MVP, ITAR-conscious).
  Private Tailscale access; RDS + S3 + Cognito + KMS. Does not co-mingle with Open WebUI VPC.

Metadata:
  Project: mike-regulated
  Compliance: HIPAA-ITAR-commercial-mvp

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    AllowedValues: [prod, staging]
  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3.medium, t3.large, t3.xlarge, m6i.large]
  DbInstanceClass:
    Type: String
    Default: db.t4g.medium
  DbName:
    Type: String
    Default: mike
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9]*"
  DbUsername:
    Type: String
    Default: mikeadmin
  LatestAmiId:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  TailscaleAuthKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional Tailscale auth key for first boot (can join manually later)
  AllowedSshCidr:
    Type: String
    Default: "127.0.0.1/32"
    Description: SSH is disabled in SG by default; parameter reserved for emergency break-glass

Conditions:
  HasTailscaleKey: !Not [!Equals [!Ref TailscaleAuthKey, ""]]

Resources:
  # ---------------------------------------------------------------------------
  # KMS
  # ---------------------------------------------------------------------------
  RegulatedKey:
    Type: AWS::KMS::Key
    Properties:
      Description: mike-regulated CMK for S3/RDS/Secrets
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Root
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"
          - Sid: ViaServices
            Effect: Allow
            Principal:
              AWS: "*"
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:CreateGrant
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
              StringLike:
                kms:ViaService:
                  - !Sub "s3.${AWS::Region}.amazonaws.com"
                  - !Sub "rds.${AWS::Region}.amazonaws.com"
                  - !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
                  - !Sub "logs.${AWS::Region}.amazonaws.com"
          - Sid: CloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*

  RegulatedKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/mike-regulated
      TargetKeyId: !Ref RegulatedKey

  # ---------------------------------------------------------------------------
  # Network
  # ---------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.50.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: mike-regulated-vpc
        - Key: Project
          Value: mike-regulated
        - Key: Compliance
          Value: HIPAA-ITAR-commercial-mvp

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: mike-regulated-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: mike-regulated-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: mike-regulated-public-b

  PrivateAppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: mike-regulated-app-a

  PrivateDbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.20.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: mike-regulated-db-a

  PrivateDbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.21.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: mike-regulated-db-b

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: mike-regulated-public-rt

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: mike-regulated-nat-eip

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: mike-regulated-nat

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: mike-regulated-private-rt

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateAppRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateAppSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateDbARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateDbSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateDbBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateDbSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # Flow logs
  FlowLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: flow-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: "*"

  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /mike-regulated/vpc-flow
      RetentionInDays: 90
      KmsKeyId: !GetAtt RegulatedKey.Arn

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceType: VPC
      ResourceId: !Ref Vpc
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogsRole.Arn
      Tags:
        - Key: Name
          Value: mike-regulated-flow

  # ---------------------------------------------------------------------------
  # Security groups
  # ---------------------------------------------------------------------------
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Mike app host — no public app ingress; Tailscale only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound for Mantle, package updates, Tailscale
      Tags:
        - Key: Name
          Value: mike-regulated-app-sg

  # No inbound rules on App SG (Tailscale userspace / encrypted mesh).
  # Emergency SSM uses instance profile, not SSH.

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS only from app SG
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Postgres from Mike app
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: mike-regulated-db-sg

  # ---------------------------------------------------------------------------
  # S3
  # ---------------------------------------------------------------------------
  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt RegulatedKey.Arn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref LogsBucket
        LogFilePrefix: s3-access/docs/
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: mike-regulated
        - Key: Compliance
          Value: HIPAA-ITAR-commercial-mvp

  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt RegulatedKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-logs
            Status: Enabled
            ExpirationInDays: 365
      Tags:
        - Key: Project
          Value: mike-regulated

  DocsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DocsBucket.Arn
              - !Sub "${DocsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  LogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt LogsBucket.Arn
              - !Sub "${LogsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: AllowS3LogDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${LogsBucket.Arn}/s3-access/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # ---------------------------------------------------------------------------
  # Secrets + RDS
  # ---------------------------------------------------------------------------
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub mike-regulated/${EnvironmentName}/db
      Description: Mike regulated RDS credentials
      KmsKeyId: !Ref RegulatedKey
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DbUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\\'
      Tags:
        - Key: Project
          Value: mike-regulated

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: mike-regulated db subnets
      SubnetIds:
        - !Ref PrivateDbSubnetA
        - !Ref PrivateDbSubnetB
      Tags:
        - Key: Name
          Value: mike-regulated-db-subnets

  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub mike-regulated-${EnvironmentName}
      Engine: postgres
      EngineVersion: "16"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: 50
      MaxAllocatedStorage: 200
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: !Ref RegulatedKey
      DBName: !Ref DbName
      MasterUsername: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      PreferredBackupWindow: "07:00-08:00"
      PreferredMaintenanceWindow: "sun:08:00-sun:09:00"
      DeletionProtection: true
      EnableCloudwatchLogsExports:
        - postgresql
      Tags:
        - Key: Project
          Value: mike-regulated
        - Key: Compliance
          Value: HIPAA-ITAR-commercial-mvp

  # ---------------------------------------------------------------------------
  # Cognito
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub mike-regulated-${EnvironmentName}
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: "ON"
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 3
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # Advanced Security (Plus) can be enabled later; OFF keeps pool on standard tier.
      UserPoolAddOns:
        AdvancedSecurityMode: "OFF"
      Schema:
        - Name: email
          Required: true
          Mutable: true
      UserPoolTags:
        Project: mike-regulated
        Compliance: HIPAA-ITAR-commercial-mvp

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: mike-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      SupportedIdentityProviders:
        - COGNITO

  # ---------------------------------------------------------------------------
  # IAM + EC2
  # ---------------------------------------------------------------------------
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub mike-regulated-app-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: mike-regulated-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3Docs
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DocsBucket.Arn
                  - !Sub "${DocsBucket.Arn}/*"
              - Sid: Secrets
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref DbSecret
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:mike-regulated/*
              - Sid: Kms
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !GetAtt RegulatedKey.Arn
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/mike-regulated/*

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AppRole

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /mike-regulated/app
      RetentionInDays: 90
      KmsKeyId: !GetAtt RegulatedKey.Arn

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref AppInstanceProfile
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 40
            VolumeType: gp3
            Encrypted: true
            KmsKeyId: !Ref RegulatedKey
            DeleteOnTermination: true
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
        InstanceMetadataTags: enabled
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euo pipefail
            dnf update -y
            dnf install -y docker git jq
            systemctl enable --now docker
            usermod -aG docker ec2-user || true

            # CloudWatch agent optional — logs go to journal for now
            mkdir -p /opt/mike-regulated
            cat >/opt/mike-regulated/stack-outputs.env <<EOF
            AWS_REGION=${AWS::Region}
            S3_BUCKET_NAME=${DocsBucket}
            COGNITO_USER_POOL_ID=${UserPool}
            COGNITO_CLIENT_ID=${UserPoolClient}
            DB_SECRET_ARN=${DbSecret}
            REGULATED_MODE=true
            PROJECT=mike-regulated
            EOF

            if [ -n "${TsKey}" ]; then
              curl -fsSL https://tailscale.com/install.sh | sh
              tailscale up --auth-key="${TsKey}" --hostname=mike-regulated --ssh=false || true
            fi

            echo "mike-regulated bootstrap complete $(date -u)" >> /var/log/mike-regulated-bootstrap.log
          - TsKey: !Ref TailscaleAuthKey
      Tags:
        - Key: Name
          Value: mike-regulated
        - Key: Project
          Value: mike-regulated
        - Key: Compliance
          Value: HIPAA-ITAR-commercial-mvp
        - Key: Environment
          Value: !Ref EnvironmentName

  MantleSecretPlaceholder:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub mike-regulated/${EnvironmentName}/mantle
      Description: Bedrock Mantle API key for Mike (set value after deploy)
      KmsKeyId: !Ref RegulatedKey
      SecretString: !Sub |
        {
          "OPENAI_API_KEY": "REPLACE_ME",
          "OPENAI_BASE_URL": "https://bedrock-mantle.us-east-2.api.aws/v1",
          "OPENAI_API_MODE": "auto",
          "OPENAI_COMPAT_ANY_MODEL": "true"
        }
      Tags:
        - Key: Project
          Value: mike-regulated

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub ${AWS::StackName}-VpcId
  DocsBucketName:
    Value: !Ref DocsBucket
    Export:
      Name: !Sub ${AWS::StackName}-DocsBucket
  LogsBucketName:
    Value: !Ref LogsBucket
  DbEndpoint:
    Value: !GetAtt DbInstance.Endpoint.Address
  DbPort:
    Value: !GetAtt DbInstance.Endpoint.Port
  DbSecretArn:
    Value: !Ref DbSecret
  MantleSecretArn:
    Value: !Ref MantleSecretPlaceholder
  CognitoUserPoolId:
    Value: !Ref UserPool
  CognitoClientId:
    Value: !Ref UserPoolClient
  AppInstanceId:
    Value: !Ref AppInstance
  AppPublicIp:
    Value: !GetAtt AppInstance.PublicIp
    Description: Bootstrap IP only; app should be accessed via Tailscale
  AppRoleArn:
    Value: !GetAtt AppRole.Arn
  KmsKeyArn:
    Value: !GetAtt RegulatedKey.Arn
  Region:
    Value: !Ref AWS::Region
